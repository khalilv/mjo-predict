# Date range for analysis
dates:
  start: '2002-01-01'
  end: '2018-01-01'

# File paths
paths:
  ground_truth: data/observed/rmm.txt
  fuxi: data/FuXi
  output_dir: plots/2002-2017

# Forecast directories
forecast_dirs: []
  # - data/corrected/mean_bias
  # - data/corrected/mvlr
  # - data/corrected/lstm

# Labels for each forecast
plot_labels: []
  # - 'Mean bias correction'
  # - 'MVLR'
  # - 'LSTM'

# Plot settings
plot_settings:
  # Font sizes and styles
  fonts:
    title: 16
    axis_label: 14
    tick_label: 14
    colorbar_label: 14
    title_weight: normal
    title_label_weight: bold  # Only bold subplot labels like (a), (b)
    # family: sans-serif

  # Plot title template (use {model} placeholder for model name)
  titles:
    template: 'Seasonality of {model} MJO forecasts'

  # Axis labels
  labels:
    x_label: 'Month'
    y_label: 'Lead time (days)'
    colorbar_label: 'BCOR'

  # Colormap settings
  colormap:
    name: "YlGnBu"
    threshold: 0.5
    # Contour levels - can be list or dict with start/stop/num
    levels:
      start: 0.1
      stop: 1.0
      num: 10

  # Label visibility
  y_labels:
    hide_x: false
    hide_y: false
    hide_colorbar: false
