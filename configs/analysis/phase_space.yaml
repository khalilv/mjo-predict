# Trajectory settings
trajectory:
  start_date: '2019-05-13'
  length: 42

# Output
paths:
  output_dir: plots/phase_space/

# Reference time-series files (continuous; sliced by trajectory window).
# Exactly one entry must have primary: true (used for date alignment).
# Set transform_to_rmm: true for OMI/ROMI sources to apply (PC1, PC2) -> (PC2, -PC1).
references:
  - path: data/observed/bom_rmm.74toRealtime.txt
    label: BoM
    color: darkgray
    linestyle: '--'
  - path: data/observed/rmm.txt
    label: Observed
    color: black
    linestyle: '--'
    primary: true

# Per-init-date single-file forecasts at <path>/<init_date>.txt
forecasts: []
  # - path: data/corrected/lstm
  #   label: LSTM
  #   color: '#2ca02c'
  #   linestyle: '-'

# Per-init-date member-directory ensembles at <path>/<init_date>/<member>.txt
ensembles:
  - path: data/FuXi/
    label: FuXi-S2S
    color: '#1f77b4'
    linestyle: '-'
    members:
      - mean

# Plot settings
plot_settings:
  figsize: [8, 8]

  fonts:
    title: 16
    axis_label: 14
    region_label: 14
    phase_label: 14
    legend: 14
    title_weight: normal
    title_label_weight: bold

  title:
    template: "{trajectory_length}-day Phase Space Diagram Initialized on 2019-05-12"

  axis:
    xlim: [-4, 4]
    ylim: [-4, 4]

  marker_interval: 5
  legend_loc: 'best'
  legend_order: ['FuXi-S2S', 'Observed', 'BoM']
