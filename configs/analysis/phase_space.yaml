# Trajectory settings
trajectory:
  start_date: '2018-06-28'
  length: 42

# Output
paths:
  output_dir: /glade/derecho/scratch/kvirji/mjo-predict/plots/production/phase_space/

# Reference time-series files (continuous; sliced by trajectory window).
# Exactly one entry must have primary: true (used for date alignment).
# Set transform_to_rmm: true for OMI/ROMI sources to apply (PC1, PC2) -> (PC2, -PC1).
references:
  - path: /glade/derecho/scratch/kvirji/DATA/MJO/U250/RMM/rmm.txt
    label: Observed
    color: black
    linestyle: '--'
    primary: true
  - path: /glade/derecho/scratch/kvirji/DATA/MJO/BoM/rmm.74toRealtime.txt
    label: BoM
    color: lightgray
    linestyle: '--'

# Per-init-date single-file forecasts at <path>/<init_date>.txt
forecasts: []
  # - path: /glade/derecho/scratch/kvirji/mjo-predict/exps/production/2019-2021/bias-correction/LSTM/combined
  #   label: LSTM
  #   color: '#2ca02c'
  #   linestyle: '-'

# Per-init-date member-directory ensembles at <path>/<init_date>/<member>.txt
ensembles:
  - path: /glade/derecho/scratch/kvirji/DATA/MJO/U250/FuXi/
    label: FuXi-S2S
    color: '#1f77b4'
    linestyle: '-'
    members:
      - mean
      # - '00'
      # - '05'

# Plot settings
plot_settings:
  figsize: [8, 8]

  fonts:
    title: 16
    axis_label: 14
    region_label: 14
    phase_label: 14
    legend: 14
    title_weight: normal
    title_label_weight: bold

  title:
    template: '{start_date}'

  axis:
    xlim: [-4, 4]
    ylim: [-4, 4]

  marker_interval: 5
  legend_loc: 'best'
