# Trajectory settings
trajectory:
  start_date: '2017-02-22'
  length: 42

# File paths
paths:
  ground_truth: /glade/derecho/scratch/kvirji/DATA/MJO/U250/RMM/rmm.txt
  bom: /glade/derecho/scratch/kvirji/DATA/MJO/BoM/rmm.74toRealtime.txt
  # ecmwf: /glade/derecho/scratch/kvirji/DATA/MJO/U250/ECMWF/2017-02-01.txt
  output_dir: /glade/derecho/scratch/kvirji/mjo-predict/plots/production/2019-2021/case_study/2017

# Forecast directories
forecast_dirs: []
  # - /glade/derecho/scratch/kvirji/mjo-predict/exps/production/2019-2021/bias-correction/LSTM/combined

# Labels for each forecast
forecast_labels: []
  # - LSTM

# Ensemble directories (each with path, label, and members)
ensemble_dirs:
  - path: /glade/derecho/scratch/kvirji/DATA/MJO/U250/FuXi/
    label: FuXi-S2S
    members:
      - mean
      # - '00'
      # - '05'
      # - '10'

# Ground truth label
gt_label: 'Observed'

# Plot settings
plot_settings:
  # Figure size
  figsize: [8, 8]

  # Font sizes and styles
  fonts:
    title: 14
    axis_label: 12
    region_label: 12
    phase_label: 12
    legend: 11
    title_weight: normal
    title_label_weight: bold  # Only bold subplot labels like (a), (b)
    # family: sans-serif

  # Plot title template (use {trajectory_length} and {start_date} placeholders)
  title:
    template: '{start_date}'

  # Axis settings
  axis:
    xlim: [-4, 4]
    ylim: [-4, 4]

  # Colormap settings
  colormap:
    name: "tab10"

  # Trajectory marker settings
  marker_interval: 5

  # Legend location
  legend_loc: 'best'
